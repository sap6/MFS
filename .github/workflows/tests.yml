name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q tests
      - run: for f in figures/*.py; do [ "$f" = figures/style.py ] || python "$f" > /dev/null; done    # every figure and table from data/
