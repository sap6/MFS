name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q tests
      - run: for f in figures/*.py; do [ "$f" = figures/style.py ] || python "$f" > /dev/null; done    # every figure and table from data/
      - run: git diff --exit-code paper/tables                     # the tables of the paper match data/
